name: Check Scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run script exercise
        run: bash task-1-script/random-data.sh

      - name: Run configuration exercise
        run: bash task-2-configuration/check-service.sh